<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>WikiES — Opciones</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #202122; }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #a2a9b1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 22px; background: #36c; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    .hint { color: #54595d; font-size: 12px; margin-top: 4px; }
    #status { margin-left: 12px; color: #14866d; font-weight: 600; }
  </style>
</head>
<body>
  <h1>WikiES — Configuración</h1>

  <label for="key">OpenAI API key</label>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off" />
  <div class="hint">Se guarda solo en tu navegador (chrome.storage.local). Nunca se envía a ningún servidor propio.</div>

  <label for="model">Modelo (traducción)</label>
  <select id="model">
    <option value="gpt-4o-mini">gpt-4o-mini (el más barato, recomendado)</option>
    <option value="gpt-4.1-mini">gpt-4.1-mini</option>
    <option value="gpt-4.1">gpt-4.1 (mejor calidad)</option>
    <option value="gpt-5-mini">gpt-5-mini</option>
  </select>

  <button id="save">Guardar</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
